name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk autoconf automake libtool ccache
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Fix buildozer.spec architecture and NDK
      run: |
        # Nastavení pouze na 64-bit architekturu (předchází selhání NDK r28c)
        sed -i 's/android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
        # Ujištění se, že API verze je 33
        sed -i 's/android.api = .*/android.api = 33/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
